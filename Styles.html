<style>
:root{--blue:#1769aa;--green:#1b8a5a;--yellow:#fff3cd;--red:#b42318;--line:#d8dee6;--bg:#f6f8fb;--text:#17212b}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text)}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px}.top span{display:block;font-size:13px;color:#53616f}.notice{background:#e8f1fb;color:#0b4f86;padding:7px 14px;font-weight:700;border-bottom:1px solid #c7d8ea}nav{position:sticky;top:59px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow:auto;padding:6px}nav button,.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;cursor:pointer}nav button.active,.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}main{padding:12px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}.metric b{font-size:28px;color:var(--blue)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.field label{font-weight:700;font-size:13px;display:block;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid var(--line);padding:7px;text-align:start;font-size:13px}th{background:#eef3f8}.alert{background:var(--yellow);border:1px solid #f5d276;padding:8px;border-radius:6px;margin:6px 0}.error{color:#fff;background:var(--red);padding:8px;border-radius:6px}.ok{color:#fff;background:var(--green);padding:8px;border-radius:6px}.loading,.empty{padding:18px;background:#fff;border:1px dashed var(--line);border-radius:8px}.rtl{direction:rtl}.qr{font-family:monospace;background:#eef3f8;padding:8px;border-radius:6px;word-break:break-all}@media(max-width:720px){nav{position:fixed;bottom:0;top:auto;left:0;right:0;z-index:6}main{padding-bottom:88px}.top{position:static}.notice{font-size:13px}nav button{font-size:12px;padding:7px}.form{grid-template-columns:1fr}table{display:block;overflow:auto}}
</style>
