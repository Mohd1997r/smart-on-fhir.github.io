let S={boot:null,route:document.getElementById('app').dataset.route||'home',loading:false};

function setLoad(v){S.loading=v;document.body.classList.toggle('busy',v)}function toast(m,err){const v=document.getElementById('view');v.prepend(el('div',{class:err?'error':'ok',text:m}))}
