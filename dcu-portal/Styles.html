<style>
:root{--blue:#1769aa;--green:#2e7d32;--yellow:#f9a825;--red:#c62828;--bg:#f5f7f9;--border:#d9e2ec}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Arabic',sans-serif;background:var(--bg);color:#1f2933}.top-alert{position:sticky;top:0;z-index:5;background:#102a43;color:white;text-align:center;padding:7px;font-weight:700}header{display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid var(--border);padding:10px 16px}h1{font-size:20px;line-height:1.25;margin:0;color:var(--blue)}h1 span{font-size:16px}button,.btn{background:var(--blue);color:white;border:0;border-radius:6px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#52606d}.danger{background:var(--red)}nav{display:flex;gap:4px;overflow:auto;background:white;border-bottom:1px solid var(--border);padding:6px}nav button{white-space:nowrap;background:#e6f0fa;color:#102a43}.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:white;border:1px solid var(--border);border-radius:8px;padding:12px}.metric{font-size:28px;font-weight:700;color:var(--blue)}main{padding:14px;max-width:1400px;margin:auto}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}label{display:flex;flex-direction:column;font-size:13px;font-weight:700}input,select,textarea{padding:8px;border:1px solid var(--border);border-radius:6px;background:white}table{width:100%;border-collapse:collapse;background:white}th,td{border:1px solid var(--border);padding:7px;text-align:left;vertical-align:top}th{background:#e6f0fa}.status-ok{color:var(--green);font-weight:700}.warn{background:#fff8e1;border-left:4px solid var(--yellow);padding:10px}.error{background:#ffebee;border-left:4px solid var(--red);padding:10px}.empty{text-align:center;padding:20px;color:#52606d}.loading{padding:20px}.qr{font-family:monospace;font-size:11px;
