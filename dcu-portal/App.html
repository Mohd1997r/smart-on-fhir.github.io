<script>
(function(){
const pages=[['home','Home / الرئيسية'],['arrival','Patient Arrival / وصول المريض'],['doctors','Doctor Dashboards / داشبوردات الأطباء'],['huddle','Daily Huddle / الهَدَل اليومي'],['add','Add Appointment / إضافة موعد'],['change','Change Appointment / تغيير موعد'],['search','Booking Search / البحث عن حجز'],['manager','Manager View / لوحة الشارج والمدير'],['help','Help & Policies / المساعدة والسياسات']];
let state={today:'2026-01-01',medications:[],specialties:[],user:null}; const app=document.getElementById('app');
function text(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function call(fn,args=[]){app.classList.add('busy'); return new Promise((res,rej)=>google.script.run.withSuccessHandler(v=>{app.classList.remove('busy');res(v)}).withFailureHandler(e=>{app.classList.remove('busy');rej(e)} )[fn].apply(null,args));}
function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button data-route="${p[0]}">${p[1]}</button>`).join(''); document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>route(b.dataset.route));}
function route(r){history.replaceState(null,'','#'+r); ({home,arrival,doctors,huddle,add,change,search,manager,help}[r]||home)().catch(err=>app.innerHTML=`<div class="error">${text(err.message||err)} / رمز الخطأ</div>`);} 
function input(name,label,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" ${extra}></label>`}
function medSelect(){return `<label>Medication / Procedure<select name="MedicationID">${state.medications.map(m=>`<option value="${text(m.MedicationID)}">${text(m.GenericName||m.MedicationID)} / ${text(m.BrandNamesAliases||'')}</option>`).join('')}</select></label>`}
function specSelect(){return `<label>Specialty<select name="Specialty">${state.specialties.map(s=>`<option>${text(s.NameEnglish||s.SpecialtyID)}</option>`).join('')}</select></label>`}
function table(rows){if(!rows||!rows.length)return '<div class="empty">No records / لا توجد سجلات</div>'; let keys=Object.keys(rows[0]).filter(k=>k!=='sheetRowNumber'); return `<table><thead><tr>${keys.map(k=>`<th>${text(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${text(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
async function home(){let h=await call('apiHome',[state.today]); document.getElementById('lastUpdated').textContent=h.lastUpdated; let cards=[['Today Bookings / حجوزات اليوم',h.todayBookings],['Arrived / وصل',h.arrived],['Not Arrived / لم يصل',h.notArrived],['In Treatment / تحت العلاج',h.inTreatment],['Completed / مكتمل',h.completed],['Pending Requests / طلبات معلقة',h.pendingRequests],['Manual Additions / إضافات يدوية',h.manualAdditions],['Appointment Changes / تعديلات المواعيد',h.appointmentChanges],['Capacity Alerts / تنبيهات السعة',h.capacityAlerts]]; app.innerHTML=`<section class="card-grid">${cards.map(c=>`<button class="card" onclick="location.hash='huddle';window.dispatchEvent(new HashChangeEvent('hashchange'))"><div>${c[0]}</div><div class="metric">${c[1]}</div></button>`).join('')}</section><div class="actions"><button data-go="arrival">تسجيل وصول مريض</button><button data-go="huddle">فتح الهَدَل اليومي</button><button data-go="add">إضافة موعد</button><button data-go="change">تغيير موعد</button><button data-go="search">البحث عن حجز</button></div>`; app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>route(b.dataset.go));}
async function arrival(){app.innerHTML=`<form id="f" class="card"><h2>Patient Arrival / وصول المريض</h2><div class="form-grid">${input('VisitDate','Visit Date','date',`value="${state.today}"`)}${input('PatientName','Patient Name')}${input('MRN','MRN / File Number')}${input('MobileNumber','Mobile Number')}${input('Room','Room / Waiting Area')}${specSelect()}${input('Consultant','Consultant')}${input('Diagnosis','Diagnosis')}${medSelect()}${input('AdministrationRoute','Administration Route')}${input('DoseNumber','Current Dose Number','number')}${input('PrimaryNurse','Primary Nurse')}${input('ArrivalTime','Arrival Time','time')}<label>Arrival Status<select name="ArrivalStatus"><option>Arrived</option><option>Not Arrived</option><option>Waiting</option><option>In Treatment</option><option>Completed</option></select></label><label>Treatment Status<select name="TreatmentStatus"><option>Pending</option><option>Given</option><option>Not Given</option><option>Deferred</option></select></label><label>Labs Status<select name="LabsStatus"><option>Not Required</option><option>Yes</option><option>No</option></select></label><label>Consent Required<select name="ConsentRequired"><option>No</option><option>Yes</option></select></label>${input('IntervalNumber','Interval Number','number')}<label>Interval Unit<select name="IntervalUnit"><option>Days</option><option>Weeks</option><option>Months</option><option>Years</option></select></label>${input('SuggestedNextAppointmentDate','Suggested Next Appointment Date','date')}${input('FinalAppointmentDate','Final Appointment Date','date')}${input('DateOverrideReason','Date Override Reason')}<label>No Next Appointment Required<select name="NoNextAppointmentRequired"><option>No</option><option>Yes</option></select></label></div><label>Other Notes<textarea name="OtherNotes"></textarea></label><button>Save Arrival</button></form><div id="msg"></div>`; submit('f','apiRecordArrival');}
function collect(form){return Object.fromEntries(new FormData(form).entries());}
function submit(id,fn){document.getElementById(id).onsubmit=async e=>{e.preventDefault(); let b=e.submitter;b.disabled=true; try{let r=await call(fn,[collect(e.target)]); document.getElementById('msg').innerHTML=`<div class="card status-ok">Saved: ${text(r.bookingId||r.visitId||r.status)}</div>`;}catch(err){document.getElementById('msg').innerHTML=`<div class="error">${text(err.message||err)}</div>`;} finally{b.disabled=false;}}}
async function doctors(){app.innerHTML=`<div class="card-grid">${state.specialties.map(s=>`<div class="card"><h3>${text(s.Icon)} ${text(s.NameEnglish)}</h3><p>${text(s.NameArabic)}</p><button data-spec="${text(s.NameEnglish)}">Open Dashboard</button><div class="qr">QR internal route: ?route=doctors&specialty=${encodeURIComponent(s.NameEnglish)}</div></div>`).join('')}</div><div id="doctorRows"></div>`; app.querySelectorAll('[data-spec]').forEach(b=>b.onclick=async()=>{let rows=await call('apiDoctorDashboard',[b.dataset.spec,state.today]); document.getElementById('doctorRows').innerHTML=table(rows);});}
async function huddle(){let h=await call('apiHuddle',[state.today]); app.innerHTML=`<div class="card"><h2>Daily Huddle / الهَدَل اليومي</h2><div class="metric">${h.metrics.TotalPatients}</div><pre>${text(JSON.stringify(h.metrics,null,2))}</pre></div><h3>Official Booked Patients</h3>${table(h.rows)}<h3>Administrative Alerts</h3>${table(h.alerts)}`;}
async function add(){app.innerHTML=`<form id="f" class="card"><h2>Manual Appointment / إضافة موعد</h2><div class="form-grid">${input('MRN','MRN')}${input('PatientName','Patient Name')}${medSelect()}${specSelect()}${input('Consultant','Consultant')}${input('DoseNumber','Dose Number','number')}<label>First Dose<select name="FirstDose"><option value="">No</option><option value="Yes">Yes</option></select></label>${input('RequestedAppointmentDate','Requested Appointment Date','date')}${input('Reason','Reason (required)')}</div><button>Submit</button></form><div id="msg"></div>`; submit('f','apiManualAdd');}
async function change(){app.innerHTML=`<div class="card"><h2>Change Appointment</h2><label>MRN<input id="mrn"></label><button id="load">Load active bookings</button><div id="list"></div></div>`; document.getElementById('load').onclick=async()=>{let rows=await call('apiActiveBookings',[document.getElementById('mrn').value]); document.getElementById('list').innerHTML=table(rows)+`<form id="f"><div class="form-grid">${input('MRN','MRN','text',`value="${text(document.getElementById('mrn').value)}"`)}${input('BookingID','BookingID')}${input('RequestedNewDate','Requested New Date','date')}${input('ChangeReason','Change Reason')}</div><button>Change</button></form><div id="msg"></div>`; submit('f','apiChangeAppointment');};}
async function search(){app.innerHTML=`<form id="f" class="card"><h2>Booking Search</h2><div class="form-grid">${input('MRN','MRN')}${input('PatientName','Patient Name')}${input('BookingID','BookingID')}${medSelect()}${input('AppointmentDate','Appointment Date','date')}${specSelect()}${input('Consultant','Consultant')}${input('BookingStatus','Booking Status')}</div><button>Search</button></form><div id="results"></div>`; document.getElementById('f').onsubmit=async e=>{e.preventDefault(); document.getElementById('results').innerHTML=table(await call('apiBookingSearch',[collect(e.target)]));};}
async function manager(){let h=await call('apiHuddle',[state.today]); app.innerHTML=`<h2>Manager View</h2><div class="warn">Restricted to charge nurse/manager/admin by server-side role checks.</div>${table(h.rows)}${table(h.alerts)}`;}
async function help(){app.innerHTML=`<div class="card"><h2>Help & Policies</h2><ul><li>Authorized Workspace users only. Access fails closed if email is missing or inactive.</li><li>All booking writes pass through server validation, lock, duplicate checks, and audit logging.</li><li>Do not enter real PHI in TEST mode. Owner/admin must configure Script Properties, Users Roles, capacity approval, and LIVE mode.</li><li>Google Workspace compliance, deployment, and approvals must be completed by the organization.</li></ul></div>`;}
async function init(){nav(); try{Object.assign(state,await call('apiBootstrap')); route((location.hash||'#home').slice(1));}catch(e){app.innerHTML=`<div class="error">Access Denied or setup incomplete: ${text(e.message||e)}</div>`;}}
document.getElementById('langBtn').onclick=()=>{document.body.dir=document.body.dir==='rtl'?'ltr':'rtl'}; window.onhashchange=()=>route((location.hash||'#home').slice(1)); init();
})();
</script>
